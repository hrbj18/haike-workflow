user nginx;
worker_processes 2;
pid /run/haike-api-proxy/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /run/haike-api-proxy/body;
    proxy_temp_path /run/haike-api-proxy/proxy;
    fastcgi_temp_path /run/haike-api-proxy/fastcgi;
    uwsgi_temp_path /run/haike-api-proxy/uwsgi;
    scgi_temp_path /run/haike-api-proxy/scgi;
    limit_req_zone $binary_remote_addr zone=haike_api_auth:1m rate=10r/m;
    server {
        listen 17894 ssl;
        server_name 8.138.207.71;
        ssl_certificate /opt/autoclip/shared/letsencrypt/live/8.138.207.71/fullchain.pem;
        ssl_certificate_key /opt/autoclip/shared/letsencrypt/live/8.138.207.71/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 6m;
        error_page 497 =307 https://8.138.207.71:17894$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_buffering off;
        location ~ ^/portal/v1/(login|register)$ {
            limit_req zone=haike_api_auth burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:17895;
        }
        location / { proxy_pass http://127.0.0.1:17895; }
    }
}
