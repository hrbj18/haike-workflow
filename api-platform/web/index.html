<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>海客科技 · API 账户中心</title>
    <link rel="icon" href="/static/brand/haike-logo.png" type="image/png" />
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/app.js" defer></script>
    <script src="/static/commerce.js" defer></script>
    <script src="/static/accounts.js" defer></script>
  <link rel="stylesheet" href="/static/brand-theme.css">
</head>
  <body>
    <div id="toast" role="status" aria-live="polite"></div>
    <section id="auth" class="auth-shell auth-simple" hidden>
      <div class="auth-panel">
        <img class="auth-logo" src="/static/brand/haike-company-logo.png" alt="海客科技" />
        <div class="auth-product">API 账户中心</div>
        <h1 id="auth-title">欢迎登录</h1>
        <div id="auth-modes" class="auth-modes" role="group" aria-label="账户入口">
          <button id="auth-login" type="button" aria-pressed="true">登录</button>
          <button id="auth-register" type="button" aria-pressed="false">注册</button>
        </div>
        <form id="auth-form" method="post">
          <label for="auth-username">用户名</label>
          <div class="auth-input">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>
            <input
              id="auth-username"
              name="username"
              maxlength="120"
              required
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              placeholder="输入用户名"
              aria-describedby="auth-error"
            />
          </div>
          <label for="auth-password">密码</label>
          <div class="auth-input">
            <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg>
            <input
              id="auth-password"
              name="password"
              type="password"
              maxlength="128"
              required
              autocomplete="current-password"
              placeholder="输入密码"
              aria-describedby="auth-error"
            />
            <button class="auth-password-toggle" type="button" data-action="account-toggle-password" aria-label="显示密码" title="显示密码" aria-pressed="false">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg>
            </button>
          </div>
          <p id="auth-error" class="auth-error" role="alert" hidden></p>
          <button class="primary full" id="auth-submit" type="submit">
            登录
          </button>
        </form>
        <div class="auth-help"><button id="auth-forgot" class="text-button" type="button" data-action="account-forgot">忘记密码？</button></div>
      </div>
    </section>
    <div id="workspace" class="workspace" hidden>
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-logo" src="/static/brand/haike-company-logo.png" alt="HAIKE 海客科技">
          <div>API 账户中心<small>海客科技 · 创作服务</small></div>
        </div>
        <div class="nav-caption">工作空间</div>
        <nav id="navigation" aria-label="账户中心导航">
          <button data-page="wallet" class="active">
            <span>◈</span> 余额与充值
          </button>
          <button data-page="keys"><span>⌘</span> API Key</button>
          <button data-page="bills"><span>▤</span> 调用账单</button>
          <button data-page="account"><span>♙</span> 账户与安全</button>
          <button data-page="catalogue" data-admin hidden><span>▦</span> 模型与价格</button>
          <button data-page="playground" data-admin hidden><span>▷</span> 接入试用</button>
          <button data-page="users" data-admin hidden><span>♙</span> 用户与充值</button>
          <button data-page="codes" data-admin hidden><span>▧</span> 兑换码管理</button>
          <button data-page="funding" data-admin hidden><span>▤</span> 充值记录</button>
          <button data-page="providers" data-admin hidden><span>⇄</span> 供应商与售价</button>
          <button data-page="operations" data-admin hidden><span>▤</span> 运营账单</button>
          <button data-page="admin" data-admin hidden><span>⚙</span> 账本与演示定价</button>
        </nav>
        <div class="sidebar-help">
          <span class="tiny">统一接入，独立计量</span>
          <p>充值、模型和任务<br />都在同一个账户下管理。</p>
          <code>http://127.0.0.1:17894/v2</code>
        </div>
        <div class="sidebar-user">
          <span id="avatar">海</span>
          <div id="user-label"></div>
          <button id="logout" aria-label="退出登录" title="退出登录">↗</button>
        </div>
      </aside>
      <main>
        <header class="topbar">
          <span id="breadcrumb">账户中心 / 余额与充值</span>
          <div>
            <span class="dot"></span> API 账户中心
            <a id="admin-link" href="/admin" hidden>运营后台 ↗</a
            ><button
              id="logout-mobile"
              aria-label="退出登录"
              class="mobile-logout"
            >
              退出
            </button>
          </div>
        </header>
        <div class="demo-banner">
          <strong>服务额度</strong>
          一个 API Key 调用全部已开通模型，共享账户余额。按实际用量计费，售价为采购成本 × 1.5。
        </div>
        <div id="page-content"></div>
        <footer>
          海客科技 · API 账户中心
          <span>金额精确到微元 · 账单时区 Asia/Shanghai</span>
        </footer>
      </main>
    </div>
    <dialog id="modal">
      <div id="modal-content"></div>
      <button class="modal-close" id="modal-close" aria-label="关闭">×</button>
    </dialog>
  </body>
</html>
