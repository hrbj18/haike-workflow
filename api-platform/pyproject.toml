[project]
name = "haike-api-platform"
version = "0.2.0"
description = "Local account, redemption, provider gateway and billing for Haike Workflow"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "cryptography>=43,<48",
    "dashscope>=1.25.17,<2",
    "tencentcloud-sdk-python-asr>=3,<4",
    "tencentcloud-sdk-python-tts>=3,<4",
    "tzdata>=2025.2",
    "oss2>=2.19,<3",
]

[dependency-groups]
dev = [
 "httpx2>=2.13.1",
 "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
