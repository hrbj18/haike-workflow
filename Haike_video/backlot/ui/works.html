<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>海客视频 · 作品管理</title>
<link rel="stylesheet" href="/ui/board.css"><link rel="stylesheet" href="/ui/navigation.css">
<link rel="stylesheet" href="/ui/works.css"></head>
<body><div class="app-frame">
<aside class="global-sidebar"><a class="global-brand" href="/"><span>HAIKE VIDEO</span><strong>海客视频</strong><small>作品、发布与归档</small></a>
<nav class="global-nav" aria-label="主导航"><div class="global-nav-group"><p>项目</p><a class="global-nav-link" href="/">项目库</a><a class="global-nav-link" href="/works" aria-current="page">作品管理</a></div>
<div class="global-nav-group"><p>通用工具</p><a class="global-nav-link" href="/automation">自动生产中心</a><a class="global-nav-link" href="/material-library">素材库</a><a class="global-nav-link" href="/audio">配音中心</a></div></nav></aside>
<main class="works-shell"><header><span class="eyebrow">HAIKE VIDEO / WORKS</span><h1>作品管理</h1><p>找到最终成片，接着修改、发布，或释放已完成作品的素材空间。</p></header>
<div class="toolbar"><label>搜索作品或项目<input id="search" type="search" placeholder="搜索作品名称、项目编号"></label>
<label>作品状态<select id="filter"><option value="all">全部作品</option><option value="candidate">待确认</option><option value="materials">资料待补</option><option value="pending">待发布</option><option value="partial">部分已发布</option><option value="published">已发布</option><option value="cleanable">可清理</option><option value="archived">已归档</option></select></label>
<label>项目日期<input id="date" type="date"></label><button id="refresh">刷新</button><button id="import">整理历史项目</button><button id="cleanup">预览批量清理</button></div>
<p id="message" role="status" aria-live="polite"></p><button id="recover">查看未完成清理</button><p id="count"></p><section id="list" class="work-list" aria-label="作品列表"></section>
<dialog id="detail" class="work-dialog"><button class="close" id="close">关闭</button><div id="detailBody"></div></dialog>
<dialog id="plan" class="work-dialog"><button class="close" id="closePlan">关闭</button><div id="planBody"></div></dialog>
</main></div><script type="module" src="/ui/works.js"></script></body></html>
