<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>素材库 · OpenMontage</title>
<style>body{margin:0;background:#10131a;color:#e5eaf1;font:15px system-ui}main{max-width:1200px;margin:auto;padding:24px}nav a{color:#9ec9ff;margin-right:20px}section{background:#1b202b;padding:20px;border-radius:12px;margin:18px 0}input,textarea,select,button{font:inherit;padding:10px;border-radius:6px;border:1px solid #475066;background:#10131a;color:inherit}input{max-width:90%}textarea{width:95%;min-height:150px}button{cursor:pointer;background:#263d62;margin:6px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #374050;padding:10px}small{color:#b7c4d8}video{max-width:100%;max-height:450px}img{max-width:100%;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}#message{white-space:pre-wrap;color:#ffd792}summary{cursor:pointer}label{display:inline-block;margin:6px}a{color:#9ec9ff}</style></head><body><main>
<nav><a href="/">项目库</a><a href="/published-clips">成片二剪</a><a href="/material-library" aria-current="page">模板选材</a><a href="/material-library/manage">素材管理</a></nav>
<h1>素材库与秒级选材</h1><p>文件保留原位置。先检索已有素材，再补采；未确认区间不能自动入片。</p><p id="stats"></p><p id="message" role="status" aria-live="polite"></p>
<section><h2>登记与检索</h2><label>路径 <input id="path" size="65" placeholder="素材文件、文件夹或 CopySkill 标准清单"></label><select id="kind" aria-label="登记类型"><option value="catalog">标准交付清单</option><option value="folder">本地文件夹</option><option value="file">本地视频</option></select><button id="import">登记</button><button id="sync">接入已有成片索引</button><p><input id="query" placeholder="品牌、型号、动作或片段描述"><button id="search">检索</button></p><div id="results"></div></section>
<section id="detail" hidden><button id="close-detail">关闭素材详情</button><h2 id="title"></h2><video id="video" controls preload="metadata"></video><div id="clips"></div>
<details id="review-panel"><summary>准备区间与裁切确认</summary><p>先看原片，选择秒段。裁切坐标为0—1；底部字幕可裁掉，主体和品牌标识尽量保留。</p><label>开始秒 <input id="start" type="number" min="0" step="0.1" value="0"></label><label>结束秒 <input id="end" type="number" min="0" step="0.1" value="3"></label><label>读图执行者 <input id="model" value="human-editor"></label><p><label>x <input id="x" type="number" step="0.01" value="0" min="0" max="1"></label><label>y <input id="y" type="number" step="0.01" value="0" min="0" max="1"></label><label>宽 <input id="w" type="number" step="0.01" value="1" min="0.1" max="1"></label><label>高 <input id="h" type="number" step="0.01" value="0.8" min="0.1" max="1"></label></p><button id="prepare">生成原片与裁切证据</button><div id="evidence"></div><p>查看全部图片后填写确认结果；品牌、型号只能来自实际画面依据。保留空列表表示未知。</p><textarea id="submission" aria-label="区间确认JSON"></textarea><button id="submit">保存区间确认</button></details></section>
<section><h2>按主题分级选片</h2><input id="topic" value="昇腾950" aria-label="主题"><button id="plan">生成需求</button><details><summary>需求与别名配置</summary><textarea id="plan-json" aria-label="选材需求JSON"></textarea></details><button id="candidates">查候选</button><button id="select">自动选三个镜头</button><button id="acquire">查看补采需求</button><p id="selection-status" role="status"></p><div id="candidate-list"></div><details><summary>详细记录（供制作助手使用）</summary><pre id="selection"></pre></details><details><summary>选材版本记录</summary><button id="history">读取历史</button><pre id="history-content"></pre></details></section>
<script src="/ui/material_library.js"></script></main></body></html>
