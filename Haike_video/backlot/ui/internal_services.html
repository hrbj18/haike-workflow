<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海客内部服务配置</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;color:#191919;background:#f7f7f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:auto;padding:32px 24px 64px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:28px}header img{width:190px}h1{font-size:28px;margin:0 0 8px}h2{font-size:18px;margin:0}p{line-height:1.7;color:#687180}a{color:#ba3b00}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;border:1px solid #d8dce3;border-radius:8px;min-height:42px;padding:9px 16px;color:#191919;font-weight:600}button:hover{background:#f5f5f3}button.primary{background:#d83f00;border-color:#d83f00;color:white}button:disabled{opacity:.5;cursor:wait}input,textarea,select{border:1px solid #d8dce3;border-radius:8px;min-height:44px;padding:10px 12px;width:100%;background:white;color:#191919}input:focus,textarea:focus,button:focus-visible{outline:3px solid #f64b0030;outline-offset:2px}section,details{background:white;border:1px solid #e3e5e9;border-radius:12px;margin:16px 0;padding:22px}summary{display:flex;justify-content:space-between;gap:20px;cursor:pointer;font-weight:700}summary span{font-size:13px;font-weight:400;color:#687180}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:22px 0}.field{display:grid;gap:8px;font-size:14px}.field small{color:#687180;line-height:1.6}form .actions,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{font-size:13px;color:#687180}.notice{padding:14px 18px;border-radius:8px;background:#fff6e9;line-height:1.7;color:#9c4700;white-space:pre-wrap}.notice:empty{display:none}.good{background:#eef8f0;color:#276343}.intro{margin-top:4px;font-size:14px}.tag{display:inline-block;border-radius:6px;background:#fff7c1;padding:4px 8px;font-size:12px}.budget-note{font-size:13px}textarea{font-family:ui-monospace,Consolas,monospace;line-height:1.7}footer{font-size:13px;color:#687180;margin-top:22px}@media(max-width:650px){main{padding:22px 16px}header{align-items:start;flex-direction:column}.fields{grid-template-columns:1fr}section,details{padding:18px}}
</style></head><body><main>
<header><div><h1>内部服务配置</h1><p class="intro">管理开发与内部测试使用的供应商服务。普通工作台只显示海客 Key。</p></div><img src="/ui/brand/haike-company-logo.png" alt="海客科技"></header>
<div id="notice" class="notice" role="status"></div>
<section><div class="actions"><h2>当前服务路线</h2><span id="mode" class="tag">正在读取</span></div><p>备用路线使用本机后台保存的供应商配置。费用直接发生在相应供应商账户，不计入中转站余额。</p><div class="actions"><button id="internal" class="primary">使用内部备用服务</button><button id="gateway">使用海客中转站</button><a href="http://127.0.0.1:14756/settings" target="_blank" rel="noreferrer">打开普通工作台</a></div></section>
<div id="providers" aria-label="内部供应商配置"></div>
<details><summary>内部调用预算策略<span>采购价格未知的服务需先填写预算</span></summary><p class="budget-note">这里只管理内部测试的调用预算，不代表供应商提供硬性扣费封顶。具体供应商、模型和估算费用会在调用确认时展示。</p><form id="budgets"><label class="field">预算策略 JSON<textarea id="policy" rows="10" spellcheck="false"></textarea></label><div class="actions" style="margin-top:16px"><button class="primary">保存预算策略</button></div></form></details>
<footer>密钥只在后台私有配置中保存；已保存的密钥不会回显。留空保留原值。修改供应商后重新启动工作台使已有后台进程加载新配置。</footer>
</main><script>
const $=id=>document.getElementById(id);
function message(text,good=false){$('notice').textContent=text;$('notice').classList.toggle('good',good)}
async function request(path,body){const response=await fetch(path,{method:body===undefined?'GET':'PUT',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});const value=await response.json();if(!response.ok)throw new Error(typeof value.detail==='string'?value.detail:'配置未保存，请核对输入');return value}
function node(tag,text){const value=document.createElement(tag);if(text!==undefined)value.textContent=text;return value}
async function load(){const data=await request('/api/internal/services');$('mode').textContent=data.service_mode==='internal'?'内部备用服务':'海客中转站';$('providers').replaceChildren();for(const provider of data.providers||[]){const panel=node('details'),summary=node('summary',provider.name||provider.id);summary.append(node('span',provider.configured?'已配置':'待配置'));panel.append(summary);const form=node('form'),fields=node('div');fields.className='fields';for(const field of provider.fields||[]){const label=node('label',field.label||field.name);label.className='field';const input=node('input');input.name=field.name;input.type=field.secret?'password':'text';input.autocomplete='off';if(field.secret){input.placeholder=field.configured?'已配置，留空保留':'请输入密钥'}else input.value=field.value??'';label.append(input);if(field.secret)label.append(node('small','仅提交新值；保存后不回显。'));fields.append(label)}const save=node('button','保存配置');save.type='submit';save.className='primary';form.append(fields,save);form.addEventListener('submit',async event=>{event.preventDefault();const values={};for(const input of form.querySelectorAll('input'))if(input.value.trim())values[input.name]=input.value.trim();save.disabled=true;try{await request('/api/internal/services/'+encodeURIComponent(provider.id),values);for(const input of form.querySelectorAll('input[type=password]'))input.value='';await load();message((provider.name||provider.id)+'配置已保存。',true)}catch(error){message(error.message)}finally{save.disabled=false}});panel.append(form);$('providers').append(panel)}}
async function setMode(mode){try{await request('/api/internal/mode',{mode});await load();message('服务路线已保存，刷新普通工作台后生效。',true)}catch(error){message(error.message)}}
$('internal').onclick=()=>setMode('internal');$('gateway').onclick=()=>setMode('gateway');
$('budgets').onsubmit=async event=>{event.preventDefault();try{await request('/api/internal/budgets',JSON.parse($('policy').value));message('预算策略已保存。',true)}catch(error){message(error.message)}};
load().catch(error=>message(error.message));request('/api/internal/budgets').then(value=>$('policy').value=JSON.stringify(value,null,2)).catch(error=>message(error.message));
</script></body></html>
