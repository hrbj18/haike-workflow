[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haike-image-refinement"
version = "1.1.0"
description = "Embeddable Responses reference-image editing with durable jobs"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13"]

[project.optional-dependencies]
http = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["image_refinement"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
