<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>完整复刻与成片对照 · 海客</title>
<style>
:root{color-scheme:light;--ink:#20282d;--muted:#768087;--line:#dde1df;--paper:#f4f5f2;--gold:#eab83b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 "Microsoft YaHei",system-ui,sans-serif}main{max-width:1700px;margin:auto;padding:35px 32px 70px}a{color:#795c15;text-underline-offset:3px}header{display:flex;justify-content:space-between;align-items:center;gap:25px;margin-bottom:26px}h1{font-size:27px;letter-spacing:-.6px;margin:0 0 8px}h2{font-size:20px;margin:0}h3{font-size:15px;margin:0}p{margin:7px 0;color:var(--muted)}.eyebrow{font-size:12px;color:#8a6a22;letter-spacing:1px;margin-bottom:8px}.notice{padding:12px 17px;border:1px solid #e5d7af;background:#fffbef;border-radius:8px;font-size:13px;margin:18px 0 26px}.notice:empty{display:none}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:15px;margin:32px 0 14px}.comparison{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}.card-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;gap:12px}.badge{font-size:11px;white-space:nowrap;color:#7a817e;background:#f0f2ed;border-radius:20px;padding:3px 9px}.badge.ready{background:#e9f1e5;color:#4c6845}.screen{position:relative;background:#0c1115;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}.screen video{width:100%;height:100%;object-fit:contain;display:block}.screen .pending{position:absolute;padding:22px;color:#a2a8ab;text-align:center;font-size:13px}.screen video[hidden]{display:none}.card-foot{display:flex;justify-content:flex-end;gap:10px;padding:9px 13px;border-top:1px solid var(--line)}button,select{font:inherit;font-size:13px;background:white;color:var(--ink);border:1px solid #ccd2d0;border-radius:6px;padding:7px 12px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:hover:not(:disabled){border-color:#a8893e}button.primary{background:var(--gold);border-color:#ddb03c}.toolbar{padding:15px 18px;background:#fff;border:1px solid var(--line);border-radius:9px;margin:17px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.toolbar label{display:flex;gap:6px;align-items:center;font-size:13px}.toolbar .progress{display:flex;gap:14px;align-items:center;flex:1;min-width:260px}.progress input{width:100%;accent-color:#d0a226}.time{font:12px/1.3 monospace;color:#747f85;min-width:95px;text-align:right}.groups{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.group{min-height:94px;background:#fff;padding:13px;text-align:left;display:flex;flex-direction:column;gap:5px}.group.active{background:#fff8e7;border-color:#d4aa42}.group b{font-size:11px;color:#93702a}.group span{font-size:12px;line-height:1.5}.group small{font-size:10px;color:#8b9498}.group-detail{display:none;margin-top:14px;padding:15px 18px;border:1px solid var(--line);border-radius:9px;background:#fff}.group-detail.open{display:flex;justify-content:space-between;align-items:center;gap:18px}.group-detail h3{font-size:14px}.group-player{display:none;max-width:880px;margin:15px auto;background:#0c1115;border-radius:8px;overflow:hidden}.group-player.open{display:block}.group-player video,.group-player img{display:block;width:100%;max-height:520px;object-fit:contain}.social{display:grid;grid-template-columns:1fr 1fr;gap:25px;max-width:1120px;margin:auto}.social .screen{aspect-ratio:4/5;max-height:650px}.social .card-foot{justify-content:space-between;align-items:center}.social a{font-size:13px}.hint{font-size:12px;max-width:900px}.loading{padding:40px;text-align:center;color:#7f898e}footer{margin-top:40px;border-top:1px solid var(--line);padding-top:17px;font-size:12px;color:#8e979b}@media(max-width:1150px){.groups{grid-template-columns:repeat(3,minmax(0,1fr))}main{padding:25px 20px 50px}.card-head{display:block}.badge{display:inline-block;margin-top:5px}}@media(max-width:820px){header{align-items:flex-start}h1{font-size:23px}.comparison{grid-template-columns:1fr}.groups{grid-template-columns:1fr 1fr}.social{grid-template-columns:1fr;max-width:520px}.toolbar .progress{flex-basis:100%}.group-detail.open{align-items:flex-start;flex-direction:column}}
</style></head><body><main>
<header><div><div class="eyebrow">海客 · 本次交付</div><h1 id="title">完整复刻与成片对照</h1><p>从完整参考到可编辑模板，再看同一套动作如何服务真实内容。</p></div><a href="/motiongit?section=dark-full">返回模板工作台</a></header>
<div class="notice" id="notes">正在读取已完成的版本…</div><div id="error" class="notice" hidden></div>
<div class="section-head"><h2>三条完整版本</h2><span class="hint">使用下方进度同步比较，也可单独全屏观看。</span></div>
<section id="comparison" class="comparison" aria-label="三个完整视频对照"></section>
<div class="toolbar" aria-label="同步播放控制"><button id="play" class="primary" disabled>一起播放</button><button id="pause" disabled>一起暂停</button><label><input type="checkbox" id="sync" checked>同步播放与定位</label><label>声音<select id="sound"><option value="reference">官方参考</option><option value="native">原生复刻</option><option value="editable">可编辑重建</option><option value="none">全部静音</option></select></label><div class="progress"><input id="seek" type="range" min="0" max="122.4" value="0" step="0.01" aria-label="三个视频的共同进度" disabled><span id="time" class="time">00:00 / 02:02</span></div></div>
<div class="section-head"><h2>十组完整动作</h2><span class="hint">点选跳到对应段落；已登记片段可单独完整预览。</span></div><section class="groups" id="groups" aria-label="完整动作目录"></section>
<div id="group-detail" class="group-detail"><div><h3 id="group-title"></h3><p class="hint" id="group-note"></p></div><button id="group-open" hidden>查看这一组完整预览</button></div><div class="group-player" id="group-player"></div>
<div class="section-head"><h2>海客账号成片</h2><span class="hint">完整口播、实拍素材、配乐与音效。</span></div><section id="social" class="social" aria-label="长者与亲子两个4比5成片"></section>
<footer>此页只用于观看与对照。调整文案、素材和人物出镜，请进入对应工作台草稿；制作、费用和发布仍沿用项目原流程。</footer>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let data=null,leader=null,seeking=false,desired=0,ignoreUntil=0;const videos=new Map();const compareIds=['reference','native','editable'];
 const node=(tag,text,className)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(className)n.className=className;return n};
 const clock=t=>String(Math.floor(Math.max(0,t)/60)).padStart(2,'0')+':'+String(Math.floor(Math.max(0,t)%60)).padStart(2,'0');
 const available=()=>compareIds.map(id=>videos.get(id)).filter(v=>v&&!v.hidden&&v.readyState>=1);
 function sound(){for(const id of compareIds){const v=videos.get(id);if(v)v.muted=$('sound').value!==id;}}
 function seekAll(time,origin=null){desired=Math.max(0,time);ignoreUntil=performance.now()+300;seeking=true;for(const v of available()){if(v===origin)continue;const to=Math.min(desired,Number.isFinite(v.duration)?Math.max(0,v.duration-.015):desired);if(Math.abs(v.currentTime-to)>.06)v.currentTime=to;}seeking=false;$('seek').value=String(desired);$('time').textContent=clock(desired)+' / '+clock(data?.total_seconds||122.4);}
 function stopGroup(){for(const old of $('group-player').querySelectorAll('video')){old.pause();old.removeAttribute('src');old.load();}}
 async function playAll(origin=null){const list=available();if(!list.length)return;stopGroup();ignoreUntil=performance.now()+350;leader=origin||leader||list[0];sound();if($('sync').checked)seekAll(leader.currentTime,leader);await Promise.all(list.map(v=>v.play().catch(()=>{})));}
 function pauseAll(){ignoreUntil=performance.now()+300;for(const v of available())v.pause();}
 function card(id,container){const m=data.media[id],article=node('article',undefined,'card'),head=node('div',undefined,'card-head'),badge=node('span',m.status_label,'badge'+(m.ready?' ready':''));head.append(node('h3',m.label),badge);const screen=node('div',undefined,'screen'),pending=node('div',m.status_label,'pending'),video=node('video');video.controls=true;video.playsInline=true;video.preload='metadata';video.hidden=!m.ready;video.setAttribute('aria-label',m.label);screen.append(pending,video);const foot=node('div',undefined,'card-foot'),full=node('button','单独全屏');full.disabled=!m.ready;full.onclick=()=>video.requestFullscreen?.();foot.append(full);article.append(head,screen,foot);container.append(article);videos.set(id,video);
  if(m.ready){video.src=m.url;pending.hidden=true;video.addEventListener('error',()=>{pending.textContent='视频暂时不可用，请刷新版本状态';pending.hidden=false;full.disabled=true;});}
  if(compareIds.includes(id)){video.muted=id!==$('sound').value;video.onloadedmetadata=()=>{$('play').disabled=$('pause').disabled=$('seek').disabled=false;if(!leader)leader=video;if(desired>0&&$('sync').checked)video.currentTime=Math.min(desired,video.duration-.015);};video.onplay=()=>{if(performance.now()<ignoreUntil)return;leader=video;if($('sync').checked)void playAll(video);};video.onpause=()=>{if(performance.now()>=ignoreUntil&&$('sync').checked)pauseAll();};video.onseeking=()=>{if(seeking||performance.now()<ignoreUntil)return;leader=video;if($('sync').checked)seekAll(video.currentTime,video);};video.ontimeupdate=()=>{if(video!==leader)return;$('seek').value=String(video.currentTime);$('time').textContent=clock(video.currentTime)+' / '+clock(data.total_seconds);if($('sync').checked&&!seeking&&performance.now()>=ignoreUntil)for(const other of available())if(other!==video&&!other.paused&&Math.abs(other.currentTime-video.currentTime)>.35){ignoreUntil=performance.now()+200;other.currentTime=video.currentTime;}};}
  else{const link=node('a','打开这条视频的可编辑草稿');link.href=data.workbench[id];foot.prepend(link);}
 }
 function selectGroup(group,button){for(const b of $('groups').children)b.classList.toggle('active',b===button);seekAll(group.start);$('group-title').textContent=String(group.number).padStart(2,'0')+' · '+group.name;$('group-note').textContent=clock(group.start)+'—'+clock(group.end)+' · 主观审美 '+group.score+'/100';$('group-detail').classList.add('open');stopGroup();$('group-player').classList.remove('open');$('group-player').replaceChildren();$('group-open').hidden=!group.preview_url;$('group-open').onclick=()=>{pauseAll();stopGroup();const player=node(group.preview_kind==='video'?'video':'img');player.src=group.preview_url;if(group.preview_kind==='video'){player.controls=true;player.playsInline=true;player.preload='metadata';}else player.alt=group.name;$('group-player').replaceChildren(player);$('group-player').classList.add('open');};}
 $('play').onclick=()=>void playAll();$('pause').onclick=pauseAll;$('sound').onchange=sound;$('seek').oninput=()=>seekAll(Number($('seek').value));$('sync').onchange=()=>{if($('sync').checked)seekAll(leader?.currentTime||desired);};
 fetch('/api/studio/motion-showcase',{cache:'no-store'}).then(async r=>{if(!r.ok)throw Error('对照版本暂未就绪，请稍后刷新');return r.json();}).then(value=>{data=value;$('title').textContent=data.title;document.title=data.title+' · 海客';$('notes').textContent=data.notes;$('seek').max=String(data.total_seconds);$('time').textContent='00:00 / '+clock(data.total_seconds);for(const id of compareIds)card(id,$('comparison'));for(const id of ['elder','child'])card(id,$('social'));for(const g of data.groups){const b=node('button',undefined,'group');b.append(node('b',String(g.number).padStart(2,'0')+' · '+(g.id==='review'?'独立审阅':g.id.toUpperCase())),node('span',g.name),node('small',g.score+'/100 · '+clock(g.start)+'—'+clock(g.end)));b.onclick=()=>selectGroup(g,b);$('groups').append(b);}}).catch(e=>{$('notes').textContent='';$('error').hidden=false;$('error').textContent=e.message;});
})();
</script></body></html>
