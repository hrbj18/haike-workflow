<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海客 · 实拍动效试镜库</title>
<style>
:root{--bg:#f3f5f8;--paper:#fff;--ink:#1f2737;--muted:#697385;--line:#dce1e9;--accent:#315ad8;--selected:#eef0ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Microsoft YaHei",sans-serif}main{max-width:1480px;margin:auto;padding:30px 38px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--accent);font-weight:700}h1{font-size:30px;margin:6px 0}h2{font-size:19px;margin:0}p{margin:6px 0;color:var(--muted)}.tag{font-size:12px;border:1px solid var(--line);padding:6px 11px;border-radius:20px;background:white}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px}.viewer{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--paper)}.viewer-head{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.stage{background:#15191f;display:flex;justify-content:center;gap:14px;padding:18px;min-height:430px}.screen{width:min(100%,440px);margin:0;min-width:0}.screen video{width:100%;aspect-ratio:4/5;display:block;max-height:58vh;background:#101314}.screen figcaption{color:#bfc7d3;font-size:12px;text-align:center;margin:8px 0 0}.screen[hidden]{display:none}.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:15px 22px;border-bottom:1px solid var(--line)}button,select{font:inherit;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:8px 12px;cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #89a2ff;outline-offset:3px}input{accent-color:var(--accent)}label{cursor:pointer;display:inline-flex;align-items:center;gap:6px}button.primary{background:var(--accent);color:white;border-color:var(--accent)}.note{padding:16px 22px}.note p{font-size:13px}.options{display:flex;flex-direction:column;gap:10px}.card{background:white;border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:1fr;overflow:hidden}.card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--selected)}.pick{border:0;background:transparent;border-radius:0;display:flex;align-items:center;gap:14px;text-align:left;padding:12px;width:100%}.pick img{width:60px;height:75px;object-fit:cover;border-radius:5px;background:#15191f}.code{font-size:12px;color:var(--accent);font-weight:700}.title{display:block;font-size:16px;font-weight:700;margin:3px 0}.meta{font-size:12px;color:var(--muted)}.choose{border-top:1px solid var(--line);font-size:12px;padding:7px 13px;justify-content:flex-end}.selection{margin-top:22px;padding:20px 24px;background:white;border:1px solid var(--line);border-radius:14px;display:flex;gap:20px;align-items:center;justify-content:space-between}.chips{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;padding:4px 9px;background:var(--selected);border-radius:5px;color:var(--accent)}.actions{display:flex;gap:9px;flex-shrink:0}button:disabled{opacity:.45;cursor:default}.foot{font-size:12px;margin:18px 3px;color:var(--muted)}#status{min-height:24px;color:var(--accent);font-size:13px}#error{color:#ae2c31;padding:10px}a{color:var(--accent)}@media(max-width:950px){main{padding:22px 16px}.workspace{grid-template-columns:1fr}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.selection{align-items:start;flex-direction:column}header{align-items:start;gap:15px}.stage{min-height:280px}h1{font-size:25px}.tag{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
[hidden]{display:none!important}
</style></head><body><main>
<header><div><div class="eyebrow">HAIKE / MOTION AUDITIONS</div><h1>实拍动效试镜库</h1><p>先看动效如何落在真实素材上，再选择喜欢的效果。</p></div><span class="tag">5 款动效 · 每条 4.5 秒 · 4:5 · 无数字人</span></header>
<div class="workspace"><section class="viewer" aria-label="动效播放器"><div class="viewer-head"><h2 id="heading">正在读取试镜库…</h2><button class="primary" id="play">播放试镜</button></div>
<div class="stage"><figure class="screen"><video id="mainVideo" controls loop muted playsinline preload="metadata"></video><figcaption id="caption">效果版 · 1440 × 1800 / 30 fps</figcaption></figure><figure class="screen" id="baselinePane" hidden><video id="baseline" loop muted playsinline preload="metadata"></video><figcaption>原片对照 · 相同片段与时间轴，直接切换</figcaption></figure></div>
<div class="controls"><button id="restart">从头重播</button><label>速度 <select id="speed"><option value="1">1× 正常</option><option value="0.5">0.5× 慢放</option><option value="0.25">0.25× 逐看</option></select></label><label><input type="checkbox" id="compare">原片并排对照</label><label id="traceLabel" hidden><input type="checkbox" id="trace">显示手部定位</label></div>
<div class="note"><p id="note"></p><p id="detail"></p><div id="error" role="alert"></div></div></section><aside class="options" id="options" aria-label="选择动效"></aside></div>
<section class="selection"><div><h2>我的动效选择 <span id="count">0 / 5</span></h2><p>勾选右侧动效，复制编号或下载清单，下次制作可以直接点名。</p><div id="chips" class="chips"></div></div><div class="actions"><button id="copy" disabled>复制选择</button><button id="download" class="primary" disabled>下载选择清单</button></div></section><div id="status" role="status" aria-live="polite"></div>
<p class="foot">使用你的真实实拍素材。静音试镜，无口播、无数字人。前四款使用 Remocn 上游效果；冲击波使用 PixiJS Filters，操作点由人工看帧校准，并非自动动作识别。<br>本页为开发试镜，选中记录保存在当前浏览器；不会自动提交制作任务。</p>
</main><script>
const $=id=>document.getElementById(id),video=$('mainVideo'),base=$('baseline');let catalog=[],active=null,selected=new Set(),switchToken=0;
try{selected=new Set(JSON.parse(localStorage.getItem('haike-motion-audition-v1')||'[]'))}catch{}
const details={whip:'横向甩动与运动模糊。效果发生在第 1.5–2.37 秒。',push:'前镜头放大穿出，后镜头接入。第 1.5–2.83 秒；这是平面实拍推进，不是三维重建。',tear:'实拍画面裂开、纸纤维边缘与碎片揭示下一镜。第 1.5–2.7 秒。',grid:'实拍纹理映射到凸起方块，保留侧面阴影和波次换景。第 1.5–2.7 秒。',touch:'第 0.4–1.8 秒围绕孩子手部操作点扩散；波心跟随人工校准轨迹。可打开黄色定位圈检查贴合程度。'};
function persist(){try{localStorage.setItem('haike-motion-audition-v1',JSON.stringify([...selected]))}catch{}}
function selection(){selected=new Set([...selected].filter(id=>catalog.some(c=>c.id===id)));$('count').textContent=selected.size+' / 5';$('chips').replaceChildren(...catalog.filter(c=>selected.has(c.id)).map(c=>{let s=document.createElement('span');s.className='chip';s.textContent=c.id+' · '+c.name;return s}));$('copy').disabled=$('download').disabled=!selected.size;persist()}
function sync(){if(!base.readyState)return;if(Math.abs(base.currentTime-video.currentTime)>.09)base.currentTime=video.currentTime;base.playbackRate=video.playbackRate;if($('compare').checked&&!video.paused&&base.paused)base.play().catch(()=>{})}
async function play(){try{await video.play();if($('compare').checked){sync();await base.play()}}catch(e){$('status').textContent='点击视频中的播放按钮开始预览。'}}
function load(c,autoplay=false){active=c;switchToken++;video.pause();base.pause();$('heading').textContent=c.id+' · '+c.name;$('note').textContent=c.note;$('detail').textContent=details[c.effect];$('traceLabel').hidden=c.effect!=='touch';if(c.effect!=='touch')$('trace').checked=false;video.poster=c.id+'.jpg';video.src=c.id+($('trace').checked?'-trace.mp4':'-effect.mp4');base.src=c.id+'-baseline.mp4';video.playbackRate=base.playbackRate=Number($('speed').value);document.querySelectorAll('.card').forEach(el=>{el.classList.toggle('active',el.dataset.id===c.id);el.querySelector('.pick').setAttribute('aria-pressed',String(el.dataset.id===c.id))});$('error').textContent='';if(autoplay)play()}
function cards(){for(const c of catalog){const box=document.createElement('div');box.className='card';box.dataset.id=c.id;const b=document.createElement('button');b.className='pick';b.innerHTML='<img alt="" src="'+c.id+'.jpg"><span><span class="code">'+c.id+'</span><span class="title">'+c.name+'</span><span class="meta">4.5 秒 · 点击预览</span></span>';b.onclick=()=>load(c,true);const l=document.createElement('label');l.className='choose';const check=document.createElement('input');check.type='checkbox';check.checked=selected.has(c.id);check.setAttribute('aria-label','选择 '+c.id+' '+c.name);check.onchange=()=>{check.checked?selected.add(c.id):selected.delete(c.id);selection()};l.append(check,document.createTextNode('加入选择'));box.append(b,l);$('options').append(box)}}
$('play').onclick=()=>video.paused?play():video.pause();$('restart').onclick=()=>{video.currentTime=0;sync();play()};$('speed').onchange=()=>{video.playbackRate=base.playbackRate=Number($('speed').value)};$('compare').onchange=()=>{$('baselinePane').hidden=!$('compare').checked;if($('compare').checked){sync();if(!video.paused)base.play().catch(()=>{})}else base.pause()};$('trace').onchange=()=>load(active,true);
video.addEventListener('play',()=>{$('play').textContent='暂停';if($('compare').checked){sync();base.play().catch(()=>{})}});video.addEventListener('pause',()=>{$('play').textContent='播放试镜';base.pause()});for(const e of ['timeupdate','seeked','ratechange'])video.addEventListener(e,sync);base.addEventListener('loadedmetadata',sync);for(const v of [video,base])v.addEventListener('error',()=>{$('error').textContent='视频加载失败，请刷新页面或检查本地试镜服务。'});
$('copy').onclick=async()=>{const text=catalog.filter(c=>selected.has(c.id)).map(c=>c.id+' '+c.name).join('、');try{await navigator.clipboard.writeText(text);$('status').textContent='已复制：'+text}catch{$('status').textContent='请复制以下编号：'+text}};
$('download').onclick=()=>{const data={version:'motion-audition-v1',aspectRatio:'4:5',duration:4.5,selection:catalog.filter(c=>selected.has(c.id)).map(c=>({id:c.id,name:c.name,effect:c.effect,preview:c.id+'-effect.mp4'}))};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='海客-动效选择.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='选择清单已导出。'};
fetch('catalog.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(c=>{catalog=c;selection();cards();load(catalog[0])}).catch(e=>{$('error').textContent='试镜目录读取失败：'+e.message});
</script></body></html>
