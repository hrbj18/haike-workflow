<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海客 · 动态素材模板</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f1e9;color:#18333f;font-family:system-ui,"Microsoft YaHei",sans-serif}main{max-width:1280px;margin:auto;padding:48px 32px 80px}header{border-bottom:2px solid #18333f;padding-bottom:30px;margin-bottom:32px}.eyebrow{font-size:13px;letter-spacing:.12em}h1{font-size:clamp(28px,4vw,52px);line-height:1.15;letter-spacing:-.04em;margin:16px 0}p{line-height:1.7;color:#4c6168}h2{font-size:27px;margin:48px 0 20px}.films{display:grid;grid-template-columns:1fr 1fr;gap:32px}.film{padding:22px;border:1px solid #c4d1d5;border-radius:6px;background:#e6edf2}.film.child{background:#ffe143;border:3px solid #172a65;border-radius:26px;color:#172a65}.film video{width:100%;max-height:660px;aspect-ratio:4/5;display:block;background:#18333f;border-radius:4px}.film h3{margin:18px 0 4px;font-size:23px}.film p{margin:4px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.tile{background:#fffcee;border:1px solid #c4d1d5;padding:14px;border-radius:9px}.tile.selected{outline:3px solid #c57640}.tile img{width:100%;aspect-ratio:4/5;object-fit:contain;background:#e6edf2}.tile h3{font-size:17px;margin:14px 0 5px}.tile p{font-size:13px;min-height:45px}button,a.button{display:inline-block;background:#183f59;color:white;border:0;border-radius:6px;padding:10px 15px;font:inherit;cursor:pointer;text-decoration:none}button.secondary{background:transparent;color:#183f59;border:1px solid #183f59;margin-left:5px}button:focus-visible,a:focus-visible{outline:3px solid #c57640;outline-offset:3px}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px}#selection{font-size:14px;color:#52666e}dialog{border:0;border-radius:14px;background:#f4f1e9;max-width:min(850px,96vw);width:850px;padding:24px}dialog::backdrop{background:#102b39c9}dialog video{display:block;width:100%;height:min(72vh,800px);background:#18333f}dialog h3{margin:0 0 14px}dialog button{margin-top:16px}.note{font-size:13px;border-top:1px solid #c4d1d5;margin-top:40px;padding-top:18px}a{color:inherit}@media(max-width:800px){main{padding:28px 18px}.grid{grid-template-columns:1fr 1fr}.films{gap:18px}.film{padding:12px}.film h3{font-size:19px}}@media(max-width:560px){.films{grid-template-columns:1fr}.film video{max-height:580px}.tile{padding:10px}.tile button{font-size:13px;padding:8px}.tile button.secondary{margin:6px 0 0}}
</style>
<main><header><div class="eyebrow">HAIKE / DYNAMIC SCENES / 01</div><h1>让真实素材<br>进入完整动态场景。</h1><p>同一套可编辑模板，两种完整视觉方向。沿用原口播与门店实拍，保留配乐和音效，本期不使用数字人。</p></header>
<section class="films" id="films"></section>
<h2>四种动作，可以点名选择</h2><p>每段5秒。先看真实素材如何在场景中移动，再选下一条要用的动作。这里的选择保存在当前浏览器，也可导出给制作任务。</p><section class="grid" id="effects"></section><div class="actions"><button id="export">导出我的动作选择</button><span id="selection" aria-live="polite"></span></div>
<p class="note">完整片通过项目统一队列生成。试镜为独立开发短样；页面选择不会直接提交生产或调用付费服务。原片、配音及私人来源文件保留在项目内。</p></main>
<dialog id="viewer"><h3 id="viewer-title"></h3><video id="viewer-video" controls playsinline></video><button id="close">关闭预览</button></dialog>
<script>
const chosen=new Set(JSON.parse(localStorage.getItem('haike-dynamic-choice-v1')||'[]'));
const names={'click-open':'同卡点击展开与返回','waterfall':'连续流动素材瀑布','spatial-gallery':'空间素材画廊','reflow':'多屏主次重排'};
function summary(){document.getElementById('selection').textContent=chosen.size?'已选：'+[...chosen].map(x=>names[x]||x).join('、'):'尚未选择动作';localStorage.setItem('haike-dynamic-choice-v1',JSON.stringify([...chosen]));}
fetch('catalog.json').then(r=>{if(!r.ok)throw Error('目录暂未就绪');return r.json()}).then(c=>{
 c.films.forEach(f=>{const article=document.createElement('article');article.className='film '+f.key;const video=document.createElement('video');video.controls=true;video.playsInline=true;video.preload='metadata';video.src=f.file;video.poster=f.poster;const title=document.createElement('h3');title.textContent=f.title;const detail=document.createElement('p');detail.textContent=f.description;article.append(video,title,detail);document.getElementById('films').append(article)});
 c.effects.forEach(e=>{const tile=document.createElement('article');tile.className='tile'+(chosen.has(e.action)?' selected':'');const img=document.createElement('img');img.src=e.poster;img.alt=e.name+'实拍预览';const title=document.createElement('h3');title.textContent=e.id+' · '+e.name;const p=document.createElement('p');p.textContent=e.description;const play=document.createElement('button');play.textContent='播放5秒';play.onclick=()=>{document.getElementById('viewer-title').textContent=title.textContent;const v=document.getElementById('viewer-video');v.src=e.file;document.getElementById('viewer').showModal();v.play().catch(()=>{})};const select=document.createElement('button');select.className='secondary';select.textContent=chosen.has(e.action)?'已选择':'选这个';select.setAttribute('aria-pressed',chosen.has(e.action));select.onclick=()=>{chosen.has(e.action)?chosen.delete(e.action):chosen.add(e.action);tile.classList.toggle('selected',chosen.has(e.action));select.textContent=chosen.has(e.action)?'已选择':'选这个';select.setAttribute('aria-pressed',chosen.has(e.action));summary()};tile.append(img,title,p,play,select);document.getElementById('effects').append(tile)});summary();
}).catch(e=>document.getElementById('films').textContent=e.message);
const dialog=document.getElementById('viewer');dialog.addEventListener('close',()=>document.getElementById('viewer-video').pause());document.getElementById('close').onclick=()=>dialog.close();
document.getElementById('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({template:'store-dynamic-scenes-v1',motions:[...chosen]},null,2)],{type:'application/json'}));a.download='海客-动态场景选择.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></html>
