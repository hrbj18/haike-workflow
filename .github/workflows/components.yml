name: Component checks
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: components-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api-platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.16
      - run: uv sync --frozen --python 3.12
      - name: Account, balance, gateway and billing regression (fake providers)
        run: uv run --frozen pytest -q
  video-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Haike_video
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.16
      - run: uv pip install --system -r requirements-dev.txt
      - name: Install media test runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Studio, motion, queue and work regression
        run: python -m pytest -q tests/backlot/test_studio_storyboard.py tests/backlot/test_studio_motion.py tests/backlot/test_studio.py tests/backlot/test_studio_update_api.py tests/backlot/test_production_queue.py tests/backlot/test_production_queue_worker.py tests/backlot/test_production_queue_server.py tests/backlot/test_work_catalog.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: prototypes/haike-avatar-generator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: prototypes/haike-avatar-generator/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          HAIKE_EMBED_BASE: /ui/avatar-generator/
      - run: node --test tests/*.test.mjs
